<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        http-equiv="Content-Type"
        content="XMLCCLREQUEST,APPLINK,MPAGES_EVENT"
        name="discern"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oncology Pending Cycle Starts</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="page-header">
        <div>
            <h1>Oncology Pending Cycle Starts</h1>
            <p>Upcoming treatment cycles requiring activation before Day 1</p>
        </div>
    </header>

    <main class="container">
        <section class="toolbar" aria-label="Patient list filters">
            <div class="field search-field">
                <label for="searchBox">Search Patient</label>
                <input
                    id="searchBox"
                    type="search"
                    placeholder="Search name or MRN..."
                    autocomplete="off"
                >
            </div>

            <div class="date-controls">
                <div class="field physician-field">
                <label for="providerSelect">Physician</label>

                <select id="providerSelect">
                <option value="0">My Patients</option>
                </select>
            </div>
                <div class="field">
                    <label for="startDate">Start Date</label>
                    <input id="startDate" type="date">
                </div>

                <div class="field">
                    <label for="endDate">End Date</label>
                    <input id="endDate" type="date">
                </div>

                <button id="applyButton" class="primary-button" type="button">
                    Apply
                </button>

                <button id="refreshButton" class="secondary-button" type="button">
                    Refresh
                </button>
            </div>
        </section>

        <section class="summary-bar" aria-live="polite">
            <span id="resultCount">0 cycles</span>
            <span id="dateRangeLabel"></span>
        </section>

        <div id="message" class="message" role="status"></div>

        <section class="table-card" aria-label="Pending oncology cycles">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th
                                scope="col"
                                class="sortable"
                                data-sort-key="name"
                                aria-sort="none"
                                title="Sort by patient name"
                            >Patient</th>
                            <th scope="col">MRN</th>
                            <th scope="col">Regimen</th>
                            <th scope="col">Pending Cycle</th>
                            <th
                                scope="col"
                                class="sortable"
                                data-sort-key="effectiveStartDate"
                                aria-sort="none"
                                title="Sort by effective start date"
                            >Confirmed Start Date</th>
                            <th scope="col">Appointment</th>
                            <th scope="col">Attending</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody id="cycleTableBody"></tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" hidden>
                No pending cycles found for the selected date range.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
